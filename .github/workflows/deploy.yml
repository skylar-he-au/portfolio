name: deploy

# Manual only: Actions -> deploy -> Run workflow. A push to main never deploys.
# Order (SPEC "部署和回退"): image -> migrations + LangGraph setup -> Cloud Run
# -> ingest -> Worker -> patrol. Rollback is manual (docs DEPLOY.md, part C).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: australia-southeast1
  SERVICE: portfolio-api
  AR_REPO: portfolio

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check variables
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          ORIGIN_URL: ${{ vars.ORIGIN_URL }}
          CLEANUP_AUDIENCE: ${{ vars.CLEANUP_AUDIENCE }}
          CLEANUP_INVOKER_EMAIL: ${{ vars.CLEANUP_INVOKER_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
          SPEND_CAPS: ${{ vars.SPEND_CAPS }}
          SECRET_VERSION_ANTHROPIC_API_KEY: ${{ vars.SECRET_VERSION_ANTHROPIC_API_KEY }}
          SECRET_VERSION_GEMINI_API_KEY: ${{ vars.SECRET_VERSION_GEMINI_API_KEY }}
          SECRET_VERSION_OPENAI_API_KEY: ${{ vars.SECRET_VERSION_OPENAI_API_KEY }}
          SECRET_VERSION_DATABASE_URL: ${{ vars.SECRET_VERSION_DATABASE_URL }}
          SECRET_VERSION_DATABASE_URL_DIRECT: ${{ vars.SECRET_VERSION_DATABASE_URL_DIRECT }}
          SECRET_VERSION_ORIGIN_SECRET: ${{ vars.SECRET_VERSION_ORIGIN_SECRET }}
          SECRET_VERSION_SESSION_SECRET: ${{ vars.SECRET_VERSION_SESSION_SECRET }}
          SECRET_VERSION_TURNSTILE_SECRET: ${{ vars.SECRET_VERSION_TURNSTILE_SECRET }}
          SECRET_VERSION_PATROL_SECRET: ${{ vars.SECRET_VERSION_PATROL_SECRET }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_PATROL_GEMINI_API_KEY: ${{ secrets.PATROL_GEMINI_API_KEY != '' }}
        run: |
          missing=()
          for name in GCP_WIF_PROVIDER GCP_DEPLOY_SA SITE_DOMAIN ORIGIN_URL \
            CLEANUP_AUDIENCE CLEANUP_INVOKER_EMAIL CLOUDFLARE_ACCOUNT_ID PUBLIC_TURNSTILE_SITEKEY \
            SPEND_CAPS SECRET_VERSION_ANTHROPIC_API_KEY SECRET_VERSION_GEMINI_API_KEY \
            SECRET_VERSION_OPENAI_API_KEY SECRET_VERSION_DATABASE_URL \
            SECRET_VERSION_DATABASE_URL_DIRECT SECRET_VERSION_ORIGIN_SECRET \
            SECRET_VERSION_SESSION_SECRET SECRET_VERSION_TURNSTILE_SECRET \
            SECRET_VERSION_PATROL_SECRET; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          [[ "$HAS_CLOUDFLARE_API_TOKEN" == true ]] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [[ "$HAS_PATROL_GEMINI_API_KEY" == true ]] || missing+=("secret PATROL_GEMINI_API_KEY")
          if ((${#missing[@]})); then
            echo "::error::Missing in the production environment: ${missing[*]}"
            exit 1
          fi
          # Pinned versions only: "latest" would make a deploy unrepeatable.
          for name in "${!SECRET_VERSION_@}"; do
            [[ "${!name}" =~ ^[0-9]+$ ]] || { echo "::error::$name must be a version number"; exit 1; }
          done
          [[ "$ORIGIN_URL" == https://* && "$ORIGIN_URL" != */ ]] \
            || { echo "::error::ORIGIN_URL must start with https:// and have no trailing /"; exit 1; }
          # SPEND_CAPS: the six spend caps as NAME=value joined by "|" (values in
          # the docs SPEC, kept out of this public repo). Errors name the
          # setting, never its value.
          want=(SPEND_DAILY_USD_ANTHROPIC SPEND_DAILY_USD_GOOGLE SPEND_DAILY_USD_OPENAI
            SPEND_MONTHLY_USD_ANTHROPIC SPEND_MONTHLY_USD_GOOGLE SPEND_MONTHLY_USD_OPENAI)
          declare -A seen=()
          bad=()
          IFS='|' read -ra caps <<< "$SPEND_CAPS"
          n=0
          for item in "${caps[@]}"; do
            n=$((n + 1))
            key=${item%%=*}
            value=${item#*=}
            if [[ "$item" != *=* ]]; then
              bad+=("entry $n is not NAME=value")
              continue
            elif [[ " ${want[*]} " != *" $key "* ]]; then
              bad+=("entry $n has an unknown name")
              continue
            elif [[ -n "${seen[$key]:-}" ]]; then
              bad+=("$key twice")
            elif [[ ! "$value" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              bad+=("$key is not a number")
            fi
            seen[$key]=1
          done
          for key in "${want[@]}"; do
            [[ -n "${seen[$key]:-}" ]] || bad+=("$key missing")
          done
          if ((${#bad[@]})); then
            printf -v msg '%s; ' "${bad[@]}"
            echo "::error::SPEND_CAPS: ${msg%; }"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Image name
        env:
          # The project ID comes from the deploy account's email, so a project
          # whose ID is not "portfolio-prod" still works.
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          SHA: ${{ github.sha }}
        run: |
          [[ -n "$PROJECT_ID" ]] || { echo "::error::auth gave no project_id"; exit 1; }
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/api:$SHA"
          } >> "$GITHUB_ENV"

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -t "$IMAGE" api
          docker push "$IMAGE"

      # Built before anything goes live, so a broken front end stops the run
      # while production is still untouched. Deployed after ingest (below).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the front end
        working-directory: web
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
        run: |
          npm ci
          npm run build
          npm run test:dist

      # Migrations need a session-level advisory lock, so they use Neon's direct
      # (non-pooled) URL; so does LangGraph's setup (CREATE INDEX CONCURRENTLY).
      - name: Migrate the database
        env:
          VERSION: ${{ vars.SECRET_VERSION_DATABASE_URL_DIRECT }}
        run: |
          DATABASE_URL=$(gcloud secrets versions access "$VERSION" \
            --secret=database-url-direct --project="$PROJECT_ID")
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          docker run --rm -e DATABASE_URL "$IMAGE" python -m app.migrate
          # The app also runs saver.setup() on its first question; running it
          # here keeps that schema change out of a live request.
          docker run --rm -e DATABASE_URL "$IMAGE" python -c '
          import asyncio, os, sys
          from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver

          async def main():
              async with AsyncPostgresSaver.from_conn_string(os.environ["DATABASE_URL"]) as saver:
                  await saver.setup()

          try:
              asyncio.run(main())
          except Exception as exc:
              # The type only: messages can hold the database host.
              sys.exit(f"LangGraph setup failed: {type(exc).__name__}")
          print("LangGraph checkpoint tables are up to date")
          '

      - name: Deploy Cloud Run
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          CLEANUP_AUDIENCE: ${{ vars.CLEANUP_AUDIENCE }}
          CLEANUP_INVOKER_EMAIL: ${{ vars.CLEANUP_INVOKER_EMAIL }}
          V_ANTHROPIC: ${{ vars.SECRET_VERSION_ANTHROPIC_API_KEY }}
          V_GEMINI: ${{ vars.SECRET_VERSION_GEMINI_API_KEY }}
          V_OPENAI: ${{ vars.SECRET_VERSION_OPENAI_API_KEY }}
          V_DATABASE: ${{ vars.SECRET_VERSION_DATABASE_URL }}
          V_ORIGIN: ${{ vars.SECRET_VERSION_ORIGIN_SECRET }}
          V_SESSION: ${{ vars.SECRET_VERSION_SESSION_SECRET }}
          V_TURNSTILE: ${{ vars.SECRET_VERSION_TURNSTILE_SECRET }}
          V_PATROL: ${{ vars.SECRET_VERSION_PATROL_SECRET }}
          SPEND_CAPS: ${{ vars.SPEND_CAPS }}
        run: |
          secrets=(
            "DATABASE_URL=database-url:$V_DATABASE"
            "ANTHROPIC_API_KEY=anthropic-api-key:$V_ANTHROPIC"
            "GEMINI_API_KEY=gemini-api-key:$V_GEMINI"
            "OPENAI_API_KEY=openai-api-key:$V_OPENAI"
            "ORIGIN_SECRET=origin-secret:$V_ORIGIN"
            "SESSION_SECRET=session-secret:$V_SESSION"
            "TURNSTILE_SECRET=turnstile-secret:$V_TURNSTILE"
            "PATROL_SECRET=patrol-secret:$V_PATROL"
          )
          # TURNSTILE_HOSTNAMES holds a comma, so the list uses "|" as its
          # delimiter (gcloud topic escaping: a leading ^|^). The spend caps come
          # from SPEND_CAPS, checked in the first step.
          IFS='|' read -ra env_vars <<< "$SPEND_CAPS"
          env_vars+=(
            "TURNSTILE_HOSTNAMES=$SITE_DOMAIN,www.$SITE_DOMAIN"
            "CLEANUP_AUDIENCE=$CLEANUP_AUDIENCE"
            "CLEANUP_INVOKER_EMAIL=$CLEANUP_INVOKER_EMAIL"
          )
          # Timeout and scaling are restated so the service never drifts from
          # SPEC. Ingress and the public-invoker setting stay as gcp-setup.sh
          # set them (changing them needs run.admin, which this account lacks).
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="portfolio-run@$PROJECT_ID.iam.gserviceaccount.com" \
            --timeout=150 \
            --min-instances=0 \
            --max-instances=2 \
            --set-secrets="$(IFS=,; echo "${secrets[*]}")" \
            --set-env-vars="^|^$(IFS='|'; echo "${env_vars[*]}")" \
            --quiet

      # After a rollback pins a revision, later deploys keep that split and the
      # new revision gets no traffic: https://docs.cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-latest \
            --quiet

      - name: Ingest the content
        env:
          V_DATABASE: ${{ vars.SECRET_VERSION_DATABASE_URL_DIRECT }}
          V_OPENAI: ${{ vars.SECRET_VERSION_OPENAI_API_KEY }}
        run: |
          DATABASE_URL=$(gcloud secrets versions access "$V_DATABASE" \
            --secret=database-url-direct --project="$PROJECT_ID")
          echo "::add-mask::$DATABASE_URL"
          OPENAI_API_KEY=$(gcloud secrets versions access "$V_OPENAI" \
            --secret=openai-api-key --project="$PROJECT_ID")
          echo "::add-mask::$OPENAI_API_KEY"
          export DATABASE_URL OPENAI_API_KEY
          # The new image's code with this commit's content/ (the image itself
          # carries no content).
          docker run --rm -e DATABASE_URL -e OPENAI_API_KEY \
            -v "$GITHUB_WORKSPACE/content:/content:ro" \
            "$IMAGE" python -m app.ingest --content-dir /content

      - name: Read the Worker secret
        id: origin
        env:
          VERSION: ${{ vars.SECRET_VERSION_ORIGIN_SECRET }}
        run: |
          value=$(gcloud secrets versions access "$VERSION" \
            --secret=origin-secret --project="$PROJECT_ID")
          echo "::add-mask::$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Custom Domain for the apex only; www is a Cloudflare redirect rule
      # (DEPLOY.md A3a). --var overrides the localhost default in wrangler.jsonc.
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          ORIGIN_SECRET: ${{ steps.origin.outputs.value }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.165.0"
          packageManager: npm
          secrets: |
            ORIGIN_SECRET
          command: deploy --var ORIGIN_URL:${{ vars.ORIGIN_URL }} --domain ${{ vars.SITE_DOMAIN }}

      - name: Summary
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          {
            echo "Deployed \`$GITHUB_SHA\`"
            echo "- Cloud Run: \`$SERVICE\` image \`$IMAGE\`"
            echo "- Worker: https://$SITE_DOMAIN"
            echo "- Tag this commit \`deploy-$(TZ=Australia/Sydney date +%F)\` once patrol is green."
          } >> "$GITHUB_STEP_SUMMARY"

  patrol:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      # Listing this workflow's earlier runs to count patrols this month.
      actions: read
    steps:
      # At most 10 patrols a month (Sydney time), counted from this workflow's
      # own history: every attempt whose "Run patrol" step finished green or red.
      - name: Count this month's patrols
        id: quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month_start=$(TZ=Australia/Sydney date +%Y-%m-01)
          since=$(date -u -d "TZ=\"Australia/Sydney\" $month_start 00:00" +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?per_page=100&created=%3E%3D$since" \
            --jq '.workflow_runs[].id')
          count=0
          for id in $runs; do
            n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=all&per_page=100" \
              --jq '[.jobs[] | select(.name == "patrol") | .steps[]?
                     | select(.name == "Run patrol" and (.conclusion == "success" or .conclusion == "failure"))]
                    | length' | awk '{ s += $1 } END { print s + 0 }')
            count=$((count + n))
          done
          echo "Patrols this month (since $since): $count"
          if ((count >= 10)); then
            echo "Patrol skipped: $count patrols already ran this month (limit 10, Sydney time)." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.quota.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: auth
        if: steps.quota.outputs.run == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - if: steps.quota.outputs.run == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - if: steps.quota.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.8"
          working-directory: patrol
          enable-cache: true

      - name: Install the patrol
        if: steps.quota.outputs.run == 'true'
        working-directory: patrol
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Run patrol
        if: steps.quota.outputs.run == 'true'
        working-directory: patrol
        env:
          PROJECT_ID: ${{ steps.auth.outputs.project_id }}
          VERSION: ${{ vars.SECRET_VERSION_PATROL_SECRET }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          PATROL_GEMINI_API_KEY: ${{ secrets.PATROL_GEMINI_API_KEY }}
          ANONYMIZED_TELEMETRY: "false"
          BH_TELEMETRY: "0"
        run: |
          PATROL_SECRET=$(gcloud secrets versions access "$VERSION" \
            --secret=patrol-secret --project="$PROJECT_ID")
          echo "::add-mask::$PATROL_SECRET"
          export PATROL_SECRET
          # Non-zero exit turns the run red; there is no automatic rollback.
          uv run python -m patrol --base-url "https://$SITE_DOMAIN"
