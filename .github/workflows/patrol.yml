name: patrol

# Only the patrol's own unit tests (no model, no browser). The patrol itself runs after a
# deploy, from deploy.yml.
on:
  push:
    branches: ["**"]
    paths:
      - "patrol/**"
      - ".github/workflows/patrol.yml"

permissions:
  contents: read

concurrency:
  group: patrol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: patrol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.8"
          python-version: "3.12"
          working-directory: patrol
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
