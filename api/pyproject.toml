[project]
name = "portfolio-api"
version = "0.1.0"
description = "Backend for the portfolio site: health checks now, project Q&A later."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "langchain-anthropic>=1.7.10",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
# Eval-only (never in default-groups: CI syncs dev only, the Docker image has no evals/).
eval = [
    "ragas==0.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -rs prints the reason for every skipped test (e.g. no TEST_DATABASE_URL).
addopts = "-rs"
markers = ["live: calls real model APIs with dev keys; skipped without keys, never in CI"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S105", "S106"]
