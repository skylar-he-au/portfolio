[project]
name = "portfolio-api"
version = "0.1.0"
description = "Backend for the portfolio site: health checks now, project Q&A later."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -rs prints the reason for every skipped test (e.g. no TEST_DATABASE_URL).
addopts = "-rs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S105", "S106"]
